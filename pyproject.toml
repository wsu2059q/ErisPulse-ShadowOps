[project]
name = "ErisPulse-ShadowOps"
version = "0.1.2"
description = "影子灰度管理模块：启动/对比/转正/放弃影子模块，附归属权审计 —— Shadow rollout ops: start/diff/promote/dismiss shadow modules, with ownership audit"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "wsu2059q" } ]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ErisPulse-Testing",
]

[project.entry-points."erispulse.module"]
"ShadowOps" = "ShadowOps:Main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ShadowOps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
